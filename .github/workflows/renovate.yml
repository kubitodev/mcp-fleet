name: renovate

# Self-contained Renovate for this repo only (GitHub Actions + Dockerfile base
# images). Weekly — this repo has few deps, and vendor/** is ignored (vendor-sync
# owns those). Needs a RENOVATE_TOKEN secret with access to THIS repo.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC (after vendor-sync + build)
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        required: false
        default: "info"
        type: choice
        options: [debug, info, warn, error]
      dryRun:
        description: "Dry run (no PRs created)"
        required: false
        default: "false"
        type: choice
        options: ["false", "full"]

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore Renovate cache
        uses: actions/cache@v6
        with:
          path: /tmp/renovate-cache
          key: renovate-cache-${{ github.run_id }}
          restore-keys: |
            renovate-cache-

      - name: Prepare cache permissions (Renovate container runs as UID 12021)
        run: |
          sudo mkdir -p /tmp/renovate-cache
          sudo chown -R 12021:0 /tmp/renovate-cache

      - name: Scan for dependency updates
        uses: renovatebot/github-action@v46.2.2
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@kubito.dev>"
          RENOVATE_REPOSITORY_CACHE: enabled
          RENOVATE_CACHE_DIR: /tmp/renovate-cache
          LOG_LEVEL: ${{ inputs.logLevel || 'warn' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == 'full' && 'full' || '' }}
        with:
          # PAT needs: Contents R/W, Pull requests R/W, Workflows R/W, Metadata R.
          token: ${{ secrets.RENOVATE_TOKEN }}

name: build

# Build + publish images for build:true entries in fleet.yaml to ghcr.io/kubitodev/<name>.
# Runs when vendored source / manifest / dockerfiles change, weekly (base-image CVEs),
# and on demand. Archive-only (build:false) MCPs are skipped.
on:
  push:
    branches: [main]
    paths:
      - "vendor/**" # vendor-sync commits source + fleet.yaml together; this is the trigger
      - ".github/workflows/build.yml"
      # dockerfile-only changes: use the weekly run or workflow_dispatch
  schedule:
    - cron: "37 4 * * 1" # Mondays 04:37 UTC (after vendor-sync)
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write        # keyless cosign / provenance
  attestations: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
      any: ${{ steps.gen.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: mikefarah/yq@v4
      - id: gen
        run: |
          include=$(./scripts/matrix.sh)
          echo "include=$include" >> "$GITHUB_OUTPUT"
          [ "$include" = "[]" ] && echo "any=false" >> "$GITHUB_OUTPUT" || echo "any=true" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: needs.matrix.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.mcp.name }}
          tags: |
            type=raw,value=${{ matrix.mcp.ref }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.mcp.ref }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.mcp.context }}
          file: ${{ matrix.mcp.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.mcp.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
